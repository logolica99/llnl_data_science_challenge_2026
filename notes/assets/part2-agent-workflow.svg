  <rect x="420" y="310" width="760" height="56" rx="14" fill="#dbe4ff" stroke="#4dabf7" stroke-width="2"/>
  <text x="800" y="345" fill="#1e1e1e" font-family="Virgil, 'Segoe Print', 'Comic Sans MS', sans-serif" font-size="16" text-anchor="middle">Skills set policy  •  MCP performs compute  •  Hash-bound files carry handoffs</text>
</svg>
