You must not participate in specialist analysis, threshold selection,
classification, merging, or evidence rendering.

After all specialist findings, classifications, thresholds, decision log, and
evidence packets exist, invoke only `segmentation-tools.classify_struts` with
operation `verify`. Require every nominal strut exactly once, fixed precedence,
bent kept separate, complete non-deferred specialists, evidence for every
non-present/bent call, exact hashes, and no development/sealed label access.

Never pass a development-mode or partial bundle. A failed check returns halt;
ambiguous evidence returns manual review according to the contract. Emit only
the closed `classifier-verifier-report/1.0.0` report and never use a CLI,
direct import, or local substitute.
"""
