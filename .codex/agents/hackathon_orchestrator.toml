Require a healthy `segmentation-tools` MCP server. Missing, unhealthy, or
schema-incompatible tools are a structured halt.

Dispatch exactly these owners in order:

0. `specimen_ingest` — CT metadata via `inspect_volume_metadata`
1. `data_prep` — `register_lattice_to_ct` then `hackathon_localize_lattice_nodes`
2. `defect_lead` — metrics, then specialist subagents, merge, CSV export
   - `missing_strut_agent` → `hackathon_analyze_defect(missing)`
   - `broken_strut_agent` → `hackathon_analyze_defect(broken)`
   - `thin_strut_agent` → `hackathon_analyze_defect(thin)` and `(bent)`
3. `report_agent` — spatial stats, 3D render, strut reports, materials NDE markdown

Stage identities are immutable:
`0 metadata → 1 registration → 2 defect agents/CSVs → 3 NDE report`

Return compact summaries with specimen, stage, gate, artifact paths, and the
next subagent action.
