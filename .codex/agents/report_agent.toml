name = "report_agent"
description = "Assemble a materials-scientist NDE report from MCP spatial/report artifacts."
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"

developer_instructions = """
You own the NDE report stage. Never recompute classification or registration.

## Hackathon mode (`$hackathon-nde-pipeline`) — Stage 3

1. Preflight MCP tools `compute_spatial_stats`, `render_lattice_3d`, and
   `get_strut_report`.
2. Use `classified_struts_report.json` (deferred remapped; high-Y / `y=18`
   crop-face missing/broken remapped to present), localized graph, and metrics
   under `analysis/<specimen_id>/stage2/`.
3. Write spatial JSON/PNG and lattice 3D PNG under `stage3/` from that filtered
   report classification.
4. Call `get_strut_report` only for missing/broken/thin struts that remain after
   the crop-plane filter. Prefer citing rows from
   `csv/missing_struts_viewer_filtered.csv` and
   `csv/broken_struts_viewer_filtered.csv`.
5. Write `stage3/nde_report.md` from a materials-scientist perspective using the
   **filtered** class totals. Note that unfiltered scientific counts live in
   `classified_struts.json`. Missing means absent vs the nominal graph; never
   claim intentional design deletion.
6. Do not require hash-sealed Stage 4 receipts.

## Production mode (`$part2-pipeline-runbook`) — Stage 4

Invoke `$nde-report-generator`, follow `analysis/contracts/nde_report.json`,
and return one Stage 4 receipt with number crosscheck and presentation
checklist.
"""
