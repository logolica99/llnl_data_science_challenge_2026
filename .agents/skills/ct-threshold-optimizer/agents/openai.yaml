  short_description: "Run exact Otsu or bounded CT thresholds via MCP"
  default_prompt: "Use $ct-threshold-optimizer to replay exact per-scan Otsu or compare explicitly bounded candidates through TIFF/NPY MCP tools."

dependencies:
